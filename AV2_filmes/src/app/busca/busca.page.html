<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="cabecalho">
      <ion-title>
        Buscador de Filmes
      </ion-title>

      <ion-label>
        <a routerLink="/home" id="labelred">Home</a>
        <a routerLink="/busca" id="labelred">Busca</a>
        <!-- <a routerLink="/infos" id="labelred" style="color: #ffff00;">Página 2</a> -->
        <a href="https://github.com/JvCaribe/projetoMobileCoding" target="_blank" id="labelred">
          GitHub
          <ion-icon src="assets/icon/logo-github.svg" aria-label="Repositório no Github"></ion-icon>
        </a>
      </ion-label>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="pesquisa">
    <input type="text" placeholder="Digite o nome do filme" [(ngModel)]="nomeFilme" (keyup)="buscarFilme()" />
    <button (click)="buscarFilme()"> Buscar </button>
  </div>

  @if(filmes.length > 0) {
  <div class="card-filmes">
    @for(filme of filmes; track filme.imdbID) {

    <div class="card">
      <ion-card>
        <img id="card-image" [alt]="filme.Title" [src]="filme.Poster" />
        <ion-card-header>

          <ion-card-title>
            <ion-button fill="clear" [routerLink]="['/infos', filme.imdbID]">
              {{ filme.Title }}
            </ion-button>
          </ion-card-title>

          <ion-card-subtitle> {{ getTipo (filme.Type) }} </ion-card-subtitle>

        </ion-card-header>

        <ion-card-content> Ano: {{ filme.Year }} </ion-card-content>

      </ion-card>
    </div>
    }
  </div>
