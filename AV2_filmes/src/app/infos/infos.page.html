<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pág2</ion-title>
    <ion-label>
      <a routerLink="/home">Home</a>
      <a routerLink="/infos">Página 2</a>
    </ion-label>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="pesquisa">
    <input type="text" id="titulo" placeholder="Digite o nome do filme" />
    <button onclick="buscarFilme()">Buscar</button>
  </div>


  <div class="meio">
    <div>
      <img class="poster" src="" alt="poster">
    </div>

    <div class="detalhes">
      <div class="title"></div>
      <div class="infos">
        <span id="anoLnc">Ano de lançamento</span>
        <span id="tipo">Tipo</span>
        <span id="rated">Classificação</span>
        <span id="genero">Gênero</span>
      </div>

      <div class="informacoes">
        <span id="textoavaliacao">
          <a>
            <img id="metascore" src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Metascore.png"
              alt="MetaScore logo" title="metascore">
            <a id="metascoreRating"></a>
          </a>
        </span>

        <span id="textoavaliacao">
          <a>
            <img id="imdb"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/IMDB_Logo_2016.svg/1280px-IMDB_Logo_2016.svg.png"
              alt="IMDb logo" title="IMDb">
            <a id="imdbRating"></a>
          </a>
        </span>

        <span id="textoavaliacao">
          <a>
            <img id="rottentomatoes"
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Rotten_Tomatoes.svg/3840px-Rotten_Tomatoes.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
              alt="Rotten Tomatoes logo" title="Rotten Tomatoes">
            <a id="rottenRating"></a>
          </a>
        </span>

      </div>

      <div class="sinopse">
        <a id="plot"></a>
      </div>
      <div class="diretor">
        <span>Diretor(a): <a id="direcao"></a></span> <br> <br>
        <span>Elenco: <a id="elenco"></a></span>
      </div>

      <span>
        <a id="linkImdb" href="" target="_blank">
        </a>
      </span>
    </div>
  </div>


</ion-content>
